# Render Blueprint for AlphaTape.
# One public web service. Postgres and Key Value stay on Render's private network.
# Docker context is the repository root. Dockerfile path is Dockerfile.render.
# Health check: GET /health on $PORT.

services:
  - type: web
    name: alphatape
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: auto
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alphatape-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: alphatape-kv
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: alphatape-kv
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: alphatape-db
    plan: free
    databaseName: alphatape
    user: alphatape
