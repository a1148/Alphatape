# Render Blueprint for AlphaTape.
# One free web service. No databases, Key Value, or env groups.
# When DATABASE_URL is unset the container runs an embedded Postgres.

services:
  - type: web
    name: alphatape
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
