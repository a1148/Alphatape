services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphatape
      POSTGRES_PASSWORD: alphatape
      POSTGRES_DB: alphatape
    ports:
      - "54329:5432"
    volumes:
      - alphatape_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphatape -d alphatape"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://alphatape:alphatape@postgres:5432/alphatape
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 3848
      WEB_ORIGIN: http://localhost:3847
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32chars}
      DATA_MODE: ${DATA_MODE:-auto}
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3848:3848"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3848/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://alphatape:alphatape@postgres:5432/alphatape
      REDIS_URL: redis://redis:6379/0
      DATA_MODE: ${DATA_MODE:-auto}
      LOG_LEVEL: info
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3848
        NEXT_PUBLIC_WS_URL: ws://localhost:3848/ws
    ports:
      - "3847:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  alphatape_pg:
